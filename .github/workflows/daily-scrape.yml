name: Daily scrape

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write profile + resume from secrets
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          MASTER_RESUME_JSON: ${{ secrets.MASTER_RESUME_JSON }}
        run: |
          printf '%s' "$PROFILE_JSON" > profile.json
          printf '%s' "$MASTER_RESUME_JSON" > master_resume.json

      - name: Seed profile + resume
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python seed.py

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: python main.py

      - name: Upload tailored resumes
        uses: actions/upload-artifact@v5
        with:
          name: tailored-resumes-${{ github.run_id }}
          path: backend/output/resumes/
          retention-days: 30
