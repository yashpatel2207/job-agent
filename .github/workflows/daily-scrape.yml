name: Daily scrape

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Set up Node (for claude CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Restore claude credentials from secret
        env:
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          mkdir -p "$HOME/.claude"
          printf '%s' "$CLAUDE_CREDENTIALS_JSON" > "$HOME/.claude/.credentials.json"
          chmod 600 "$HOME/.claude/.credentials.json"
          claude auth status

      - name: Write profile + resume from secrets
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          MASTER_RESUME_JSON: ${{ secrets.MASTER_RESUME_JSON }}
        run: |
          printf '%s' "$PROFILE_JSON" > profile.json
          printf '%s' "$MASTER_RESUME_JSON" > master_resume.json

      - name: Seed profile + resume
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python seed.py

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py

      - name: Upload tailored resumes
        uses: actions/upload-artifact@v4
        with:
          name: tailored-resumes-${{ github.run_id }}
          path: backend/output/resumes/
          retention-days: 30
